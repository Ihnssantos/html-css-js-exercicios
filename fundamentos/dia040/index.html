    <title>Flexbox Eixos</title>

<body>

<p>
    <strong>Flexbox possui dois eixos:</strong>
    Main Axis e Cross Axis.
</p>

<p><strong>Main Axis:</strong> eixo principal, definido pelo flex-direction.</p>

<p><strong>Cross Axis:</strong> eixo perpendicular ao Main Axis.</p>

<div class="container">
    <div>Item 1</div>
    <div>Item 2</div>
    <div>Item 3</div>
</div>

</body>

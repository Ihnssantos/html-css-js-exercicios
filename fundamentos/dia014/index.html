<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
</head>
<body>
<header>
    <h1>Contato</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. A at, atque aut culpa dolorum ea earum excepturi illo
        nesciunt odio officiis perferendis perspiciatis placeat quae quia vel vitae voluptate voluptates!</p>
</header>

<main>
    <section>
        <h2>Envie uma mensagem</h2>

        <form action="">
            <label for="nome">Nome: </label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="email">Email: </label>
            <input type="email" id="email" name="email">

            <label for="msg">Mensagem: </label>
            <textarea name="msg" id="msg" cols="30" rows="10"></textarea>

            <button type="submit">Enviar mensagem</button>
        </form>
    </section>
</main>

<footer>
    <p>Estudos diários de desenvolvimento.</p>
</footer>

</body>
</html>
